<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" /> <!-- Deep Blue -->
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" /> <!-- Gold -->
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Scale of Justice Base -->
  <rect x="48" y="20" width="4" height="60" fill="#ffffff" rx="2" />
  <rect x="30" y="80" width="40" height="4" fill="#ffffff" rx="2" />
  
  <!-- Scale Arms -->
  <path d="M20 30 Q50 10 80 30" stroke="#ffffff" stroke-width="3" fill="none" />
  
  <!-- Scale Pans -->
  <path d="M15 30 L25 30 L20 45 Z" fill="#ffffff" opacity="0.9" />
  <path d="M75 30 L85 30 L80 45 Z" fill="#ffffff" opacity="0.9" />

  <!-- Digital Circuit Nodes (Tech element) -->
  <circle cx="50" cy="20" r="3" fill="#fbbf24" />
  <circle cx="20" cy="30" r="3" fill="#fbbf24" />
  <circle cx="80" cy="30" r="3" fill="#fbbf24" />
  <circle cx="50" cy="80" r="3" fill="#fbbf24" />
  
  <!-- Glint -->
  <circle cx="30" cy="30" r="10" fill="#ffffff" opacity="0.1" />
</svg>
